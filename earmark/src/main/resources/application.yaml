server:
  port: 8083
spring:
  data:
    web:
      pageable:
        max-page-size: 10
  profiles:
    active: local
  application:
    name: earmark
  datasource:
    url: jdbc:postgresql://localhost:${earmark.db.port}/${earmark.db.name}
    username: ${earmark.db.username}
    password: ${earmark.db.password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${eureka.defaultZone}
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG