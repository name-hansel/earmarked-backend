server:
  port: 8083
spring:
  profiles:
    active: local
  application:
    name: earmark
  datasource:
    url: jdbc:postgresql://localhost:${earmark.db.port}/${earmark.db.name}
    username: ${earmark.db.username}
    password: ${earmark.db.password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG