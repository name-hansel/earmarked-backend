spring:
  cloud:
    openfeign:
      client:
        config:
          spotify-api:
            connect-timeout: 2000
            read-timeout: 5000
          spotify-auth-api:
            connect-timeout: 2000
            read-timeout: 5000
  profiles:
    active: local
  application:
    name: spotify-service
  data:
    redis:
      host: localhost
      port: ${spotify.redis.port}
server:
  port: 8082
spotify:
  auth-url: https://accounts.spotify.com
  api-url: https://api.spotify.com/v1
eureka:
  client:
    service-url:
      defaultZone: ${eureka.defaultZone}
logging:
  level:
    org.springframework.web: DEBUG