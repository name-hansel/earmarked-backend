spring:
  profiles:
    active: local
  application:
    name: spotify
  data:
    redis:
      host: localhost
      port: ${spotify.redis.port}
server:
  port: 8082
spotify:
  auth-url: https://accounts.spotify.com
  api-url: https://api.spotify.com/v1
logging:
  level:
    org.springframework.web: DEBUG