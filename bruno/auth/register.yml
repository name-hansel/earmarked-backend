info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}/api/auth/register"
  body:
    type: json
    data: |-
      {
          "email": "test@earmarked.local",
          "username": "testuser",
          "password": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
