info:
  name: change password
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{api_url}}/api/auth/change-password"
  body:
    type: json
    data: |-
      {
          "oldPassword": "password",
          "newPassword": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
