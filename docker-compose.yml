services:
  authentication-db:
    image: postgres:17
    container_name: authentication-db
    environment:
      POSTGRES_DB: ${AUTHENTICATION_DB}
      POSTGRES_USER: ${AUTHENTICATION_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTHENTICATION_DB_PASSWORD}
    ports:
      - "${AUTHENTICATION_DB_PORT}:5432"
    volumes:
      - authentication-db-data:/var/lib/postgresql/data

  earmarked-db:
    image: postgres:17
    container_name: earmarked-db
    environment:
      POSTGRES_DB: ${EARMARKED_DB}
      POSTGRES_USER: ${EARMARKED_DB_USERNAME}
      POSTGRES_PASSWORD: ${EARMARKED_DB_PASSWORD}
    ports:
      - "${EARMARKED_DB_PORT}:5432"
    volumes:
      - earmarked-db-data:/var/lib/postgresql/data

  authentication_redis:
    image: redis:8
    container_name: authentication-redis
    ports:
      - "${AUTHENTICATION_REDIS_PORT}:6379"
    volumes:
      - authentication-redis-data:/redis

  spotify-redis:
    image: redis
    container_name: spotify-redis
    ports:
      - "${SPOTIFY_REDIS_PORT}:6379"
    volumes:
      - spotify-redis-data:/redis


volumes:
  authentication-db-data:
  earmarked-db-data:
  authentication-redis-data:
  spotify-redis-data: