services:
  authentication-db:
    image: postgres:17
    container_name: authentication-db
    environment:
      POSTGRES_DB: ${AUTHENTICATION_DB}
      POSTGRES_USER: ${AUTHENTICATION_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTHENTICATION_DB_PASSWORD}
    ports:
      - "${AUTHENTICATION_DB_PORT}:5432"
    volumes:
      - authentication-db-data:/var/lib/postgresql/data

  earmark-db:
    image: postgres:17
    container_name: earmark-db
    environment:
      POSTGRES_DB: ${EARMARK_DB}
      POSTGRES_USER: ${EARMARK_DB_USERNAME}
      POSTGRES_PASSWORD: ${EARMARK_DB_PASSWORD}
    ports:
      - "${EARMARK_DB_PORT}:5432"
    volumes:
      - earmark-db-data:/var/lib/postgresql/data

  authentication_redis:
    image: redis:8
    container_name: authentication-redis
    ports:
      - "${AUTHENTICATION_REDIS_PORT}:6379"
    volumes:
      - authentication-redis-data:/redis

  spotify-redis:
    image: redis
    container_name: spotify-redis
    ports:
      - "${SPOTIFY_REDIS_PORT}:6379"
    volumes:
      - spotify-redis-data:/redis
  
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  authentication-db-data:
  earmark-db-data:
  authentication-redis-data:
  spotify-redis-data:
  kafka-data: