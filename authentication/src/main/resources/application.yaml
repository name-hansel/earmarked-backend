spring:
  profiles:
    active: local
  application:
    name: authentication
  datasource:
    url: jdbc:postgresql://localhost:${authentication.db.port}/${authentication.db.name}
    username: ${authentication.db.username}
    password: ${authentication.db.password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: ${authentication.redis.port}
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG