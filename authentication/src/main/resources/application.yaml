server:
  port: 8081

spring:
  profiles:
    active: local,resend
  application:
    name: authentication-service
  datasource:
    url: jdbc:postgresql://localhost:${authentication.db.port}/${authentication.db.name}
    username: ${authentication.db.username}
    password: ${authentication.db.password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: ${authentication.redis.port}

eureka:
  client:
    service-url:
      defaultZone: ${eureka.defaultZone}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG